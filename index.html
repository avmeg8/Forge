<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FORGE</title>
  <meta name="description" content="FORGE — build your body, track your strength, level up your muscles. A workout tracker made for one adjustable dumbbell.">
  <meta name="theme-color" content="#0d0f12">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FORGE">
  <meta name="application-name" content="FORGE">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="src/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="src/assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="src/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="src/styles/main.css">
  <link rel="modulepreload" href="src/main.js">
</head>
<body>
  <div id="app" aria-live="polite">
    <div style="min-height:100dvh;display:grid;place-items:center;color:#8a939f;font:600 13px/1 system-ui;letter-spacing:.3em">FORGE</div>
  </div>
  <nav id="nav" class="nav" aria-label="Main navigation" hidden></nav>
  <div id="overlay-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px;color:#eceef1;font-family:system-ui">FORGE needs JavaScript to run.</p></noscript>
  <script>
    /* Self-repair: if the app can't start (e.g. a half-updated offline cache), throw away the
       cached app files — never your workout data, which lives in IndexedDB — and load fresh. */
    (function () {
      var KEY = 'forge-repair-at', done = false;
      function repair(reason) {
        if (done || window.__forgeReady) return;
        done = true;
        var last = 0;
        try { last = Number(localStorage.getItem(KEY)) || 0; } catch (e) {}
        var app = document.getElementById('app');
        if (Date.now() - last < 120000) {
          app.innerHTML = '<div style="min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;color:#eceef1;font:15px/1.5 system-ui"><div><p style="font-weight:700;font-size:18px">FORGE couldn\'t start</p><p style="color:#8a939f">Check your connection, then try again. Your workouts are safe on this phone.</p><button onclick="location.reload()" style="margin-top:12px;min-height:48px;padding:0 22px;border-radius:12px;border:0;background:#f08a3c;color:#1a0f06;font-weight:700">Try again</button></div></div>';
          return;
        }
        try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
        app.innerHTML = '<div style="min-height:100dvh;display:grid;place-items:center;color:#8a939f;font:600 13px/1.4 system-ui;letter-spacing:.08em;text-align:center">Updating FORGE…</div>';
        console.warn('[FORGE] self-repair:', reason);
        var jobs = [];
        if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      }
      window.addEventListener('error', function (e) {
        // a module that fails to load or link stops the whole app before it can show anything
        if (!window.__forgeReady && (e.target && e.target.tagName === 'SCRIPT' || /module|export|import|Unexpected|is not defined|SyntaxError/i.test(e.message || ''))) repair(e.message || 'script error');
      }, true);
      setTimeout(function () { if (!window.__forgeReady && navigator.serviceWorker && navigator.serviceWorker.controller) repair('timeout'); }, 9000);
    })();
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
